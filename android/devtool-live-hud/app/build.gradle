plugins {
    id 'com.android.application'
}

def releaseValue = { String name ->
    providers.gradleProperty(name).orElse(providers.environmentVariable(name)).orNull
}
def releaseStoreFile = releaseValue('DEVTOOL_RELEASE_STORE_FILE')
def releaseStorePassword = releaseValue('DEVTOOL_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = releaseValue('DEVTOOL_RELEASE_KEY_ALIAS')
def releaseKeyPassword = releaseValue('DEVTOOL_RELEASE_KEY_PASSWORD')
def releaseSigningReady = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { it != null && !it.trim().isEmpty() }
// ACTIONS-10: this opt-in is honored only for one explicit task invocation.
// Merely passing the property to assembleRelease or devtoolReleaseValidation
// cannot bypass the ordinary protected/signed-release checks.
def unsignedTask = ':app:devtoolAssembleUnsignedReleaseCandidate'
def unsignedAabTask = ':app:devtoolBundleUnsignedReleaseCandidate'
def unsignedBundleRequested = (providers.gradleProperty('devtool.unsignedReleaseBundle').orNull == 'true')
def unsignedBundleCandidate = unsignedBundleRequested && gradle.startParameter.taskNames == [unsignedAabTask]
if (unsignedBundleRequested && !unsignedBundleCandidate) {
    throw new GradleException('Unsigned AAB property is restricted to the dedicated bundle candidate task')
}
if (unsignedBundleCandidate && releaseSigningReady) {
    throw new GradleException('Unsigned AAB candidate refuses configured release credentials')
}
def unsignedRequested = (providers.gradleProperty('devtool.unsignedReleaseCandidate').orNull == 'true')
def unsignedCandidate = unsignedRequested && gradle.startParameter.taskNames == [unsignedTask]
if (unsignedRequested && (!unsignedCandidate || unsignedBundleRequested)) {
    throw new GradleException('Unsigned release property is restricted to the dedicated candidate task')
}
if (unsignedCandidate && releaseSigningReady) {
    throw new GradleException('Unsigned release candidate refuses configured release signing credentials')
}
def releaseSigningStamp = layout.buildDirectory.file('devtool/verification/release-signing.txt')
def releaseApkVerificationReport = layout.buildDirectory.file('reports/devtool/release-apk-verification.txt')

android {
    namespace 'io.github.mikeceead.devtoolhud'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'io.github.mikeceead.devtoolhud'
        minSdk 26
        targetSdk 36
        versionCode 31
        versionName '1.17.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }

    testOptions {
        animationsDisabled true
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
        htmlOutput file("${layout.buildDirectory.get()}/reports/lint/lint.html")
        xmlOutput file("${layout.buildDirectory.get()}/reports/lint/lint-results-release.xml")
        sarifOutput file("${layout.buildDirectory.get()}/reports/lint/lint.sarif")
    }

    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
    }
}

tasks.register('verifyReleaseSigning') {
    group = 'verification'
    description = 'Reject release builds unless all Devtool signing values are supplied.'
    if (releaseSigningReady) {
        inputs.file(file(releaseStoreFile)).withPropertyName('releaseStoreFile')
        inputs.property('releaseKeyAlias', releaseKeyAlias)
    }
    outputs.file(releaseSigningStamp)
    outputs.upToDateWhen {
        releaseSigningReady && file(releaseStoreFile).isFile()
    }
    doLast {
        if (!releaseSigningReady) {
            throw new GradleException('Release signing is required. Set DEVTOOL_RELEASE_STORE_FILE, DEVTOOL_RELEASE_STORE_PASSWORD, DEVTOOL_RELEASE_KEY_ALIAS, and DEVTOOL_RELEASE_KEY_PASSWORD.')
        }
        if (!file(releaseStoreFile).isFile()) {
            throw new GradleException("Release keystore does not exist: ${releaseStoreFile}")
        }
        def stamp = releaseSigningStamp.get().asFile
        stamp.parentFile.mkdirs()
        stamp.text = "store=${file(releaseStoreFile).canonicalPath}\nalias=${releaseKeyAlias}\n"
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    if (!unsignedCandidate) {
        if (!unsignedBundleCandidate) dependsOn tasks.named('verifyReleaseSigning')
    }
}

// Produces ONLY an unqualified, unsigned release-variant candidate.
// Normal assembleRelease and full release validation continue to require signing.
tasks.register('devtoolAssembleUnsignedReleaseCandidate') {
    group = 'build'
    description = 'Build an explicitly unsigned, unqualified release candidate for local signing.'
    dependsOn 'assembleRelease'
    doLast {
        if (!unsignedCandidate || releaseSigningReady) {
            throw new GradleException('Unsigned release candidate may run only through its opt-in task without credentials')
        }
        def folder = layout.buildDirectory.dir('outputs/apk/release').get().asFile
        def outputs = folder.listFiles()?.findAll { it.isFile() && it.name.endsWith('.apk') } ?: []
        if (outputs.size() != 1 || !outputs[0].name.endsWith('-unsigned.apk')) {
            throw new GradleException('Expected exactly one unsigned release APK; refusing ambiguous/signed output')
        }
    }
}

// G4 candidate is an explicitly unsigned and unqualified AAB only.
// Ordinary bundleRelease still requires the LIFE/release signing contract.
tasks.register('devtoolBundleUnsignedReleaseCandidate') {
    group = 'build'
    description = 'Build a private, unsigned AAB for source-bound local LIFE signing.'
    dependsOn 'bundleRelease', 'testDebugUnitTest', 'lintRelease'
    doLast {
        if (!unsignedBundleCandidate || releaseSigningReady) {
            throw new GradleException('Unsigned AAB candidate requires opt-in and no signing credentials')
        }
        def folder = layout.buildDirectory.dir('outputs/bundle/release').get().asFile
        def outputs = folder.listFiles()?.findAll { it.isFile() && it.name.endsWith('.aab') } ?: []
        if (outputs.size() != 1) {
            throw new GradleException('Expected exactly one unsigned AAB; refusing ambiguous output')
        }
    }
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn rootProject.tasks.named('verifyStableToolchainBaseline')
}

tasks.register('verifyReleaseApk') {
    group = 'verification'
    description = 'Build and verify the signed release APK with apksigner.'
    dependsOn 'assembleRelease'
    def releaseApk = layout.buildDirectory.file('outputs/apk/release/app-release.apk')
    inputs.file(releaseApk).withPropertyName('releaseApk')
    outputs.file(releaseApkVerificationReport)
    doLast {
        def apk = releaseApk.get().asFile
        if (!apk.isFile() || apk.length() == 0L) {
            throw new GradleException("Release APK was not produced: ${apk}")
        }
        def sdkRoot = System.getenv('ANDROID_SDK_ROOT') ?: System.getenv('ANDROID_HOME')
        if (sdkRoot == null || sdkRoot.trim().isEmpty()) {
            throw new GradleException('ANDROID_SDK_ROOT or ANDROID_HOME is required to verify the release APK.')
        }
        def apksigner = file("${sdkRoot}/build-tools/36.0.0/apksigner")
        if (!apksigner.canExecute()) {
            throw new GradleException("apksigner is unavailable: ${apksigner}")
        }
        exec {
            commandLine apksigner.absolutePath, 'verify', '--verbose', '--print-certs', apk.absolutePath
        }
        def report = releaseApkVerificationReport.get().asFile
        report.parentFile.mkdirs()
        report.text = "verified=${apk.canonicalPath}\nsize=${apk.length()}\n"
    }
}

// Full signed-release gate. The assemble dependency is shared with
// verifyReleaseApk, so Gradle only schedules it once in this invocation.
tasks.register('devtoolReleaseValidation') {
    group = 'verification'
    description = 'Run signed release verification, unit tests, and release lint as one task graph.'
    dependsOn 'verifyReleaseApk', 'testDebugUnitTest', 'lintRelease'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

