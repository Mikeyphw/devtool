[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-devtool"
version = "0.2.3"
description = "Generic Unix developer helper CLI with Rich summaries, validation batches, clipboard prompts, notifications, and repo automation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "OpenAI"}]
dependencies = [
  "rich>=13.7.0",
]

[project.scripts]
devtool = "repo_devtool.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"repo_devtool" = ["py.typed"]

[tool.setuptools.packages.find]
include = ["repo_devtool*"]
exclude = ["tests*", "share*", "completions*"]
