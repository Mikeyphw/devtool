[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devtool"
version = "0.2.24"
description = "Generic Unix developer helper CLI with Rich summaries, validation batches, clipboard prompts, notifications, and repo automation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "OpenAI"}]
dependencies = [
  "rich>=13.7.0",
]

[project.scripts]
devtool = "devtool.cli:main"
devtool-termux-chroot = "devtool.termux_chroot_runner:main"
devtool-androidos = "devtool.termux_chroot_runner:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"devtool" = ["py.typed"]

[tool.setuptools.packages.find]
include = ["devtool*"]
exclude = ["tests*", "share*", "completions*"]
