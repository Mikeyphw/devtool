[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devtool"
version = "1.1.0"
description = "Generic Unix developer helper CLI with transactional overlays, validation, clipboard summaries, live HUD progress, and repo automation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "OpenAI"}]
dependencies = [
  "rich>=13.7.0",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]


[project.scripts]
devtool = "devtool.cli:main"
devtool-test = "devtool.test_helper:main"
devtool-termux-chroot = "devtool.termux_chroot_runner:main"
devtool-androidos = "devtool.termux_chroot_runner:main"
devtool-control-center-hud = "devtool.desktop.gtk_hud_cli:main"
devtool-control-center = "devtool.desktop.control_center_cli:main"
build-apk = "devtool.android_build:standalone_main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"devtool" = ["py.typed", "resources/gradle/*.gradle", "resources/ui/*.json", "resources/oci/android-arm64/*", "resources/wrapper/*"]

[tool.setuptools.packages.find]
include = ["devtool*"]
exclude = ["tests*", "share*", "completions*"]

[tool.pytest.ini_options]
addopts = "--tb=short -ra --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = ["default"]
markers = [
  "requires_tool(name): requires an external executable; skipped when unavailable",
  "requires_posix: requires POSIX process/signal/file-descriptor semantics",
  "not_termux(reason): host integration that is impossible on native Termux",
  "slow_external: legacy intentional slow-test budget exemption; does not imply external-tool lane membership",
  "fast: fast deterministic editing-feedback lane",
  "unit: unit/contract classification (legacy-compatible)",
  "integration: real Git/process/PTY/repository integration lane",
  "external: real external compiler/tool/environment lane",
  "system: broad roadmap/federation/release/seal qualification lane",
  "serial: legacy alias for exclusive process-global state",
  "stateful: test intentionally exercises persistent state boundaries",
  "parallel_safe: explicitly qualified for parallel execution",
  "serial_process_global: requires exclusive process-global state",
  "serial_repository: requires exclusive repository mutation state",
  "serial_device: requires exclusive device state",
  "serial_port_socket: requires exclusive port/socket state",
  "requires_git: requires real Git semantics",
  "requires_host_capability(name): requires an explicit host capability",
  "public_contract: tests a durable public/behavior contract",
  "white_box: intentionally tests an internal implementation boundary",
  "devtool_check(id): durable Devtool test/check identity",
  "devtool_group(name): stable Devtool test/check group membership",
  "behavior(name): enduring behavior/domain identity for migration",
  "test_dependency(check_id): explicit stable test/check dependency",
  "devtool_budget(name): explicit lane/profile budget class",
]
