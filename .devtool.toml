# CORE-X04: Devtool dogfoods the generated repository wrapper.  Keep this
# intentionally small: the wrapper is a frontend over canonical Devtool, not a
# second task/scheduler authority.
[wrapper]
schema = 2
default_command = "test"

[wrapper.commands.test]
description = "Run Devtool's canonical Python test action"
devtool = "test"
target = "devtool"
allow_passthrough = true

[wrapper.commands.validate]
description = "Run Devtool's canonical validation workflow"
devtool = "validate"
target = "devtool"
allow_passthrough = true

[wrapper.commands.build]
