  "tests/test_frx_x02_target_identity_convergence.py",
  "tests/test_frx_x03_executable_federation_groups.py",
  "tests/test_frx_x04_real_repo_adoption_reseal.py",
]

[[test]]
id = "roadmap-frx-y01"
name = "FRX-Y01 parallel federation DAG scheduler"
runner = "pytest"
command = [
  "python", "-m", "pytest", "-q",
