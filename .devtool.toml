name = "PRES-R03 retained PRES remediation fixed point"
runner = "pytest"
timeout_seconds = 600
command = [
  "python", "-m", "pytest", "-q", "--tb=short",
  "tests/test_pres_r01_execution_presentation.py",
  "tests/test_pres_r02_textual_control_center_app.py",
  "tests/test_pres_h02_textual_apply_host.py",
  "tests/test_pres_x08_textual_control_center.py",
  "tests/test_pres_g2_interaction_reliability_remediation.py",
  "tests/test_pres_g2_interaction_reliability_gate.py",
  "tests/test_pres_r03_textual_parity_qualification.py",
  "-k", "not real_textual_execution_app_updates_and_confirms_cancel and not real_apply_host_app_runs_on_textual_main_thread_when_required and not real_textual_control_center_pages_selection_confirmation_and_live_refresh and not real_textual_r03_navigation_help_palette_failure_live_resize_and_shutdown",
]

[[test]]
id = "roadmap-pres-r03-real-textual-apps"
name = "PRES-R03 real Textual App.run_test Pilot matrix"
runner = "command"
timeout_seconds = 600
env = { DEVTOOL_PRES_R01_REQUIRE_TEXTUAL = "1", DEVTOOL_PRES_R02_REQUIRE_TEXTUAL = "1", DEVTOOL_PRES_R03_REQUIRE_TEXTUAL = "1", DEVTOOL_PRES_H02_REQUIRE_TEXTUAL = "1" }
command = [
  "python", "-m", "pytest", "-q", "--tb=short",
  "tests/test_pres_r01_execution_presentation.py",
  "tests/test_pres_r02_textual_control_center_app.py",
  "tests/test_pres_h02_textual_apply_host.py",
  "tests/test_pres_r03_textual_parity_qualification.py",
  "-k", "real_textual_execution_app_updates_and_confirms_cancel or real_apply_host_app_runs_on_textual_main_thread_when_required or real_textual_control_center_pages_selection_confirmation_and_live_refresh or real_textual_r03_navigation_help_palette_failure_live_resize_and_shutdown",
]

