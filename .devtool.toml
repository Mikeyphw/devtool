[project]
runner = "python"
platform = "server"
run_module = "devtool"

[workspace]
default_target = "devtool"
[execution]
environment = "auto"
chroot_name = "androidos"

[python]
manager = "auto"
test_framework = "pytest"
locked = true
install_project = true
isolation = true
lint = []

[targets.devtool]
runner = "python"
platform = "server"
root = "."
execution_environment = "native-termux"

[targets.android_hud]
runner = "android"
platform = "android"
root = "android/devtool-live-hud"
execution_environment = "chroot"
chroot_name = "androidos"

[targets.android_hud.android]
variant = "debug"
aapt2_provider = "auto"
instrumentation = "when-device-present"
prefer_native_termux = false

[targets.android_hud.gradle]
max_workers = 2
parallel = true
no_daemon = false
daemon_idle_timeout_ms = 900000
build_cache = true
structured_events = false
fail_fast = false
offline = false
args = [
  "-Dorg.gradle.parallel=true",
  "-Dorg.gradle.vfs.watch=false",
]

[targets.android_hud.gradle.task_aliases.debug_validation]
tasks = [":app:assembleDebug", ":app:testDebugUnitTest", ":app:lintDebug"]
replacement = "devtoolDebugValidation"
phases = ["validation"]

[targets.android_hud.tasks]
build = [":app:assembleDebug"]
test = [":app:testDebugUnitTest"]
lint = [":app:lintDebug"]
seal = ["devtoolDebugValidation"]
instrumentation = [":app:connectedDebugAndroidTest"]
clean = [":app:clean"]

[targets.android_hud.artifacts]
required = true
external_verification = "auto"

[targets.android_hud.validation]
android_safe = false
# This app is small enough to coalesce build/test/lint into one Gradle invocation.
# Durable validation still keeps resumable semantic phases, but explicitly skips
# compile/resources/dependencies because assemble/test/lint already cover them.
split_gradle = false
max_workers = 2
cpu_limit = 2
parallel = true
no_daemon = false
stop_daemon_after_phase = false
low_priority = false
memory_guard_mb = 0
gradle_heap_mb = 1152
gradle_metaspace_mb = 512
gradle_packaging_metaspace_mb = 640
gradle_lint_metaspace_mb = 640
affected_module_lint = true

[targets.devtool.validation]
python_safe = true
low_priority = false
memory_guard_mb = 0
[targets.android_hud.validation.phase_profiles.preflight]
max_workers = 1
cpu_limit = 1
gradle_heap_mb = 768
gradle_metaspace_mb = 512
memory_guard_mb = 0
no_daemon = false
low_priority = false


[targets.android_hud.validation.phase_profiles.compile]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 512
memory_guard_mb = 0
no_daemon = false
low_priority = false


[targets.android_hud.validation.phase_profiles.resources]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 512
memory_guard_mb = 0
no_daemon = false
low_priority = false


[targets.android_hud.validation.phase_profiles.unit-test]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 512
memory_guard_mb = 0
no_daemon = false
low_priority = false


[targets.android_hud.validation.phase_profiles.package]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 512
memory_guard_mb = 0
no_daemon = false
low_priority = false


[targets.android_hud.validation.phase_profiles.lint]
max_workers = 1
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 512
memory_guard_mb = 0
no_daemon = false
low_priority = false


[targets.android_hud.validation.phase_profiles.instrumentation]
max_workers = 1
cpu_limit = 2
gradle_heap_mb = 1024
gradle_metaspace_mb = 512
memory_guard_mb = 0
no_daemon = false
low_priority = false


[targets.android_hud.validation.phases]
preflight = [
  "verifyStableToolchainBaseline",
]
dependencies = []
compile = []
resources = []
unit-test = [
  ":app:testDebugUnitTest",
]
package = [
  ":app:assembleDebug",
]
lint = [
  ":app:lintDebug",
]


# DEVTOOL-ROADMAP-00: native self-hosted roadmap execution contract.
# Keep roadmap checks first-class: tests own test identity, TLJ owns non-test
# operations, and workflows own milestone dependency order.
[targets.devtool.jobs.source-syntax]
runner = "command"
command = ["python", "-m", "compileall", "-q", "devtool", "tests"]
inputs = ["devtool/**", "tests/**"]
outputs = [".devtool/cache/roadmap-pyc/**"]

[targets.devtool.jobs.source-syntax.env]
PYTHONPYCACHEPREFIX = ".devtool/cache/roadmap-pyc"

[targets.devtool.workflows]
roadmap-smoke = [
  { id = "syntax", ref = "job:source-syntax", depends_on = [] },
  { id = "workflow-exo", ref = "test:roadmap-workflow-exo-baseline", depends_on = ["syntax"] },
]
roadmap-frx-y01 = [
  { id = "syntax", ref = "job:source-syntax", depends_on = [] },
  { id = "frx-baseline", ref = "test:roadmap-frx-baseline", depends_on = ["syntax"] },
  { id = "frx-y01", ref = "test:roadmap-frx-y01", depends_on = ["frx-baseline"] },
  { id = "workflow-exo", ref = "test:roadmap-workflow-exo-baseline", depends_on = ["frx-y01"] },
]
roadmap-git-frx02 = [
  { id = "syntax", ref = "job:source-syntax", depends_on = [] },
  { id = "git-frx01", ref = "test:roadmap-git-frx01", depends_on = ["syntax"] },
  { id = "git-frx02", ref = "test:roadmap-git-frx02", depends_on = ["git-frx01"] },
  { id = "workflow-exo", ref = "test:roadmap-workflow-exo-baseline", depends_on = ["git-frx02"] },
]
roadmap-current = [
  { id = "syntax", ref = "job:source-syntax", depends_on = [] },
  { id = "artifact-validation", ref = "test:roadmap-artifact-validation", depends_on = ["syntax"] },
  { id = "frx-baseline", ref = "test:roadmap-frx-baseline", depends_on = ["syntax"] },
  { id = "frx-y01", ref = "test:roadmap-frx-y01", depends_on = ["frx-baseline"] },
  { id = "git-frx01", ref = "test:roadmap-git-frx01", depends_on = ["syntax"] },
  { id = "git-frx02", ref = "test:roadmap-git-frx02", depends_on = ["git-frx01"] },
  { id = "workflow-exo", ref = "test:roadmap-workflow-exo-baseline", depends_on = ["syntax"] },
]

[[test]]
id = "roadmap-artifact-validation"
name = "Roadmap artifact validation baseline"
runner = "pytest"
command = [
  "python", "-m", "pytest", "-q",
  "--junitxml=.devtool/reports/roadmap/roadmap-artifact-validation.xml",
  "tests/test_artifact_validation_fail_closed_hotfix.py",
  "tests/test_tsys04_artifact_test_protocol.py",
]

