import groovy.json.JsonOutput
import java.util.concurrent.atomic.AtomicLong
import javax.inject.Inject
import org.gradle.api.Plugin
import org.gradle.api.Project
import org.gradle.api.services.BuildService
import org.gradle.api.services.BuildServiceParameters
import org.gradle.build.event.BuildEventsListenerRegistry
import org.gradle.tooling.events.FinishEvent
import org.gradle.tooling.events.OperationCompletionListener
import org.gradle.tooling.events.task.TaskFailureResult
import org.gradle.tooling.events.task.TaskFinishEvent
import org.gradle.tooling.events.task.TaskSkippedResult
import org.gradle.tooling.events.task.TaskSuccessResult

// ENV-X03 standard telemetry adapter. BuildEventsListenerRegistry + a shared
// BuildService is the Configuration-Cache-compatible task-completion surface.
// Test details and producer artifacts are obtained from bounded post-run reports
// and artifact collectors, so this adapter never walks task outputs or registers
// legacy task/test listener callbacks.
abstract class DevtoolTaskEventsService implements BuildService<BuildServiceParameters.None>, OperationCompletionListener {
    private final AtomicLong sequence = new AtomicLong(0L)
    private final AtomicLong completed = new AtomicLong(0L)
    private final String runId = System.getenv('DEVTOOL_RUN_ID') ?: ''

    private synchronized void emit(String kind, Map payload = [:]) {
        def event = [
            sequence: sequence.incrementAndGet(),
            timestamp: new Date().format("yyyy-MM-dd'T'HH:mm:ss.SSSXXX"),
            kind: kind,
            run_id: runId,
        ]
        event.putAll(payload)
        println("DEVTOOL_EVENT " + JsonOutput.toJson(event))
    }

    @Override
    void onFinish(FinishEvent finishEvent) {
        if (!(finishEvent instanceof TaskFinishEvent)) {
            return
        }
        def event = (TaskFinishEvent) finishEvent
        def result = event.result
        String outcome
        if (result instanceof TaskFailureResult) {
            outcome = 'failed'
        } else if (result instanceof TaskSuccessResult && result.fromCache) {
            outcome = 'from-cache'
        } else if (result instanceof TaskSuccessResult && result.upToDate) {
            outcome = 'up-to-date'
        } else if (result instanceof TaskSkippedResult) {
            outcome = 'skipped'
        } else {
            outcome = 'success'
        }
        emit('task-finish', [
            task: event.descriptor.taskPath,
            completed: completed.incrementAndGet(),
            total: 0,
            outcome: outcome,
        ])
    }
}

abstract class DevtoolTaskEventsPlugin implements Plugin<Project> {
    private final BuildEventsListenerRegistry registry

    @Inject
    DevtoolTaskEventsPlugin(BuildEventsListenerRegistry registry) {
        this.registry = registry
    }

    @Override
    void apply(Project project) {
        if (project != project.rootProject) {
            return
        }
        def service = project.gradle.sharedServices.registerIfAbsent(
            'devtoolTaskEvents', DevtoolTaskEventsService
        ) {}
        registry.onTaskCompletion(service)
    }
}

allprojects { project ->
    if (project == project.rootProject) {
        project.pluginManager.apply(DevtoolTaskEventsPlugin)
    }
}
