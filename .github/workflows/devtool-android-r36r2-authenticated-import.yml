# R36-R2 source contracts. No Gradle, GitHub token, artifact download, signing or device.
name: Devtool R36-R2 authenticated real-consumer import source tests (non-release)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'devtool/actions_r35_verified_import.py'
      - 'devtool/actions_r36_verified_import.py'
      - 'tests/test_r36_verified_import.py'
      - '.github/workflows/devtool-android-r36r2-authenticated-import.yml'
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact Devtool source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install locked test requirements
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check -e . -r devtool-test-requirements.lock
      - name: Verify R35/R36 integration and transport contracts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q \
            tests/test_r35_verified_import.py \
            tests/test_r36_verified_import.py \
            tests/test_actions_04_artifact_retrieval.py \
            tests/test_actions_g01_artifact_attempt_safety.py \
            tests/test_android_artifacts.py \
            --junitxml "$RUNNER_TEMP/r36r2-tests.xml"
      - name: Record source evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r36r2"
          git rev-parse HEAD > "$RUNNER_TEMP/r36r2/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/r36r2/tree.txt"
          printf '%s\n' "${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" > "$RUNNER_TEMP/r36r2/run-attempt.txt"
          if test -f "$RUNNER_TEMP/r36r2-tests.xml"; then
            cp "$RUNNER_TEMP/r36r2-tests.xml" "$RUNNER_TEMP/r36r2/tests.xml"
          fi
          (cd "$RUNNER_TEMP/r36r2" && sha256sum ./* > SHA256SUMS)
      - name: Upload source-only evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: devtool-r36r2-source-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/r36r2/
          if-no-files-found: error
          retention-days: 7
