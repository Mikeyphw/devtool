name: Devtool Python Launcher v3 Contract
on:
  pull_request:
    paths:
      - devtool/launcher_contract_v3.py
      - devtool/launcher_validation_contract.py
      - devtool/delivery_adoption.py
      - tests/test_launcher_validation_delivery.py
      - devtool/storage_layout.py
      - devtool/actions_artifacts.py
      - devtool/github_app.py
      - tests/test_github_app_m4.py
      - tests/test_delivery_m4_integration.py
      - tests/test_m4_storage_artifact_recovery.py
      - docs/DEVTOOL_M4_BUGFIX_CONSOLIDATED.md
      - tests/test_storage_layout.py
      - tests/test_validation_sessions.py
      - tests/test_storage_layout_integration.py
      - tests/test_validation_interactive_menu.py
      - tests/test_test_selection.py
      - tests/test_ts00_pytest_selection_parity.py
      - docs/LAUNCHER_VALIDATION_DELIVERY_V32.md
      - docs/OVERLAY_VALIDATION.md
      - docs/TEST_SELECTION.md
      - docs/VALIDATION_MENU.md
      - devtool/delivery_github.py
      - devtool/delivery_provider.py
      - devtool/delivery_ci_registrar.py
      - tests/test_launcher_contract_v3.py
      - tests/test_targeted_default_contract.py
      - tests/test_delivery_ci_registrar.py
      - tests/test_delivery_github.py
      - tests/test_delivery_ci_window_pagination.py
      - docs/DEVTOOL_LAUNCHER_CONTRACT_V3.md
      - devtool/delivery_rich.py
      - devtool/m6_live.py
      - devtool/m6_operation_view.py
      - devtool/wrapper_execution.py
      - tests/test_m6_live.py
      - docs/DEVTOOL_M6_NATIVE_INSPECTION.md
      - devtool/operator_rich.py
      - devtool/operator_workspace.py
      - devtool/operator_event_feed.py
      - tests/test_operator_workspace.py
      - tests/test_operator_event_feed.py
      - docs/UX_RICH03_LIVE_OPERATOR_WORKSPACE.md
      - docs/UX_RICH04_EVENT_EXPLORER.md
      - devtool/actions_pipeline.py
      - devtool/actions_presentation.py
      - tests/test_actions_pipeline_projection.py
      - tests/test_operator_rich.py
      - docs/UX_RICH02_OPERATOR_WORKSPACE.md
      - devtool/delivery_remote_logs.py
      - devtool/summary.py
      - devtool/cli.py
      - devtool/interactive/validation_menu.py
      - tests/test_delivery_remote_logs.py
      - docs/UX_RICH01_COMPLETION.md
      - devtool/delivery_cli.py
      - devtool/actions_cli.py
      - tests/test_delivery_rich.py
      - docs/RICH_DELIVERY_MONITOR.md
      - devtool/launcher_runtime_compat.py
      - devtool/github_actions.py
      - tests/test_launcher_runtime_compat.py
      - docs/LAUNCHER_RUNTIME_COMPATIBILITY.md
      - docs/CI_RUN_PAGINATION.md
      - .github/workflows/devtool-launcher-v3.yml
      - devtool/native_delivery_contract_v3.py
      - devtool/native_runtime_preflight.py
      - devtool/native_delivery_continuity.py
      - devtool/native_overlay_delivery.py
      - devtool/delivery_session.py
      - tests/test_native_runtime_preflight_m2.py
      - tests/test_native_delivery_continuity_m3.py
      - tests/test_delivery_session.py
      - docs/DEVTOOL_NATIVE_DELIVERY_V3_M3_CONTINUITY.md
      - docs/DEVTOOL_NATIVE_DELIVERY_V3_M2_PREFLIGHT.md
      - devtool/artifacts.py
      - devtool/artifact_lifecycle.py
      - devtool/artifact_inspection.py
      - devtool/executable_overlay.py
      - config/delivery-required-ci.json
      - tests/test_native_delivery_contract_v3.py
      - tests/test_artifact_v2.py
      - tests/test_artifact_lifecycle_ui.py
      - tests/test_artifact_inspection.py
      - tests/test_artifact_pipeline_v2.py
      - tests/test_artifact_validation_fail_closed_hotfix.py
      - tests/test_artifact_validator_payload_policy.py
      - tests/test_g0a_executable_overlay.py
      - tests/test_executable_overlay_deletion.py
      - tests/test_g0a_native_delivery_coordinator.py
      - tests/test_g0c3_launcher_compatibility.py
      - tests/test_validation_manifest_skip_contract.py
      - tests/test_delivery_ci_policy.py
      - docs/EXECUTABLE_OVERLAY_DELETIONS.md
      - docs/DEVTOOL_NATIVE_DELIVERY_V3_M0_AUDIT.md
      - docs/DEVTOOL_NATIVE_DELIVERY_V3_M0_TEST_MATRIX.md
      - docs/DEVTOOL_NATIVE_DELIVERY_V3_M1_CONTRACT.md
      - docs/DEVTOOL_NATIVE_OVERLAY_DELIVERY_V3_ROADMAP.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install Devtool and declared dependencies
        run: python3 -m pip install --disable-pip-version-check .
      - name: Validate launcher contract and adversarial tests
        run: python3 -B -m unittest discover -s tests -p 'test_launcher_contract_v3.py' -v
      - name: Run current delivery CI registration tests (exact source)
        run: |
          python3 -B -m pip install --disable-pip-version-check pytest pexpect cryptography
          python3 -B -m pytest -q tests/test_delivery_ci_registrar.py tests/test_delivery_github.py tests/test_delivery_ci_window_pagination.py
      - name: Verify Rich delivery and Actions live monitor contracts
        run: python3 -B -m unittest discover -s tests -p 'test_delivery_rich.py' -v
      - name: Verify M6 portrait, launcher boundaries and saved receipt contracts
        run: python3 -B -m pytest -q tests/test_m6_live.py tests/test_wrap05_wrapper_dispatch.py
      - name: Verify native Rich log fetch and compact manifest contracts
        run: python3 -B -m unittest discover -s tests -p 'test_delivery_remote_logs.py' -v
      - name: Verify source-attested forward 3.x launcher ABI contracts
        run: python3 -B -m unittest discover -s tests -p 'test_launcher_runtime_compat.py' -v
      - name: Verify unified Rich operator view contracts
        run: python3 -B -m unittest discover -s tests -p 'test_operator_rich.py' -v
      - name: Verify native pipeline dependency projection and legacy journal compatibility
        run: python3 -B -m unittest discover -s tests -p 'test_actions_pipeline_projection.py' -v
      - name: Verify persistent Rich workspace, source and SSH negative contracts
        run: python3 -B -m pytest -q tests/test_operator_workspace.py
      - name: Verify live canonical event explorer and filtering negative contracts
        run: python3 -B -m pytest -q tests/test_operator_event_feed.py
      - name: Verify targeted validation fallback and manifest phase precedence
        run: python3 -B -m pytest -q tests/test_targeted_default_contract.py
      - name: Verify canonical storage redirection and durable session recovery
        run: python3 -B -m pytest -q tests/test_storage_layout.py tests/test_validation_sessions.py tests/test_m4_storage_artifact_recovery.py tests/test_actions_04_artifact_retrieval.py tests/test_actions_g01_artifact_attempt_safety.py
      - name: Run hosted integration and interactive regression checks (not on Termux)
        run: |
          python3 -B -m pytest -q --maxfail=1 \
            tests/test_storage_layout_integration.py \
            tests/test_validation_interactive_menu.py \
            tests/test_test_selection.py \
            tests/test_ts00_pytest_selection_parity.py \
            tests/test_artifact_validation_fail_closed_hotfix.py
      - name: Verify M4 scoped GitHub App and exact-source delivery tests
        run: python3 -B -m pytest -q tests/test_github_app_m4.py tests/test_delivery_m4_integration.py
      - name: Verify validation-aware native launcher and embedded hook contracts
        run: python3 -B -m unittest discover -s tests -p 'test_launcher_validation_delivery.py' -v
      - name: Verify native adoption/source validation backwards compatibility
        run: python3 -B -m pytest -q tests/test_delivery_adoption.py tests/test_delivery_adoption_cli.py tests/test_artifact_validator_payload_policy.py
      - name: Verify M0-M3 native delivery, commit continuity and artifact security regressions
        run: |
          python3 -B -m pytest -q \
            tests/test_native_delivery_continuity_m3.py \
            tests/test_delivery_session.py \
            tests/test_native_runtime_preflight_m2.py \
            tests/test_native_delivery_contract_v3.py \
            tests/test_artifact_v2.py \
            tests/test_artifact_lifecycle_ui.py \
            tests/test_artifact_inspection.py \
            tests/test_artifact_pipeline_v2.py \
            tests/test_g0a_executable_overlay.py \
            tests/test_executable_overlay_deletion.py \
            tests/test_g0a_native_delivery_coordinator.py \
            tests/test_g0c3_launcher_compatibility.py \
            tests/test_validation_manifest_skip_contract.py \
            tests/test_delivery_ci_policy.py
      - name: Verify package import and builder CLI
        run: |
          python3 -B -m devtool.launcher_contract_v3 --help
          python3 -B -m devtool.launcher_contract_v3 build --help
          python3 -B -m devtool --help
