name: Devtool Python Launcher v3 Contract
on:
  pull_request:
    paths:
      - devtool/launcher_contract_v3.py
      - devtool/delivery_github.py
      - devtool/delivery_ci_registrar.py
      - tests/test_launcher_contract_v3.py
      - tests/test_delivery_ci_registrar.py
      - tests/test_delivery_ci_window_pagination.py
      - docs/DEVTOOL_LAUNCHER_CONTRACT_V3.md
      - devtool/delivery_rich.py
      - devtool/operator_rich.py
      - devtool/actions_pipeline.py
      - devtool/actions_presentation.py
      - tests/test_actions_pipeline_projection.py
      - tests/test_operator_rich.py
      - docs/UX_RICH02_OPERATOR_WORKSPACE.md
      - devtool/delivery_remote_logs.py
      - devtool/summary.py
      - devtool/cli.py
      - tests/test_delivery_remote_logs.py
      - docs/UX_RICH01_COMPLETION.md
      - devtool/delivery_cli.py
      - devtool/actions_cli.py
      - tests/test_delivery_rich.py
      - docs/RICH_DELIVERY_MONITOR.md
      - devtool/launcher_runtime_compat.py
      - devtool/github_actions.py
      - tests/test_launcher_runtime_compat.py
      - docs/LAUNCHER_RUNTIME_COMPATIBILITY.md
      - docs/CI_RUN_PAGINATION.md
      - .github/workflows/devtool-launcher-v3.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Devtool and declared dependencies
        run: python3 -m pip install --disable-pip-version-check .
      - name: Validate launcher contract and adversarial tests
        run: python3 -B -m unittest discover -s tests -p 'test_launcher_contract_v3.py' -v
      - name: Run current delivery CI registration tests (exact source)
        run: |
          python3 -B -m pip install --disable-pip-version-check pytest
          python3 -B -m pytest -q tests/test_delivery_ci_registrar.py tests/test_delivery_ci_window_pagination.py
      - name: Verify Rich delivery and Actions live monitor contracts
        run: python3 -B -m unittest discover -s tests -p 'test_delivery_rich.py' -v
      - name: Verify native Rich log fetch and compact manifest contracts
        run: python3 -B -m unittest discover -s tests -p 'test_delivery_remote_logs.py' -v
      - name: Verify source-attested forward 3.x launcher ABI contracts
        run: python3 -B -m unittest discover -s tests -p 'test_launcher_runtime_compat.py' -v
      - name: Verify unified Rich operator view contracts
        run: python3 -B -m unittest discover -s tests -p 'test_operator_rich.py' -v
      - name: Verify native pipeline dependency projection and legacy journal compatibility
        run: python3 -B -m unittest discover -s tests -p 'test_actions_pipeline_projection.py' -v
      - name: Verify package import and builder CLI
        run: |
          python3 -B -m devtool.launcher_contract_v3 --help
          python3 -B -m devtool.launcher_contract_v3 build --help
          python3 -B -m devtool --help
