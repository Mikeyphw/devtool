# R32 Devtool source-only non-release qualification; no Gradle invocation.
name: Devtool ANDROID-R32 source qualification (not release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Devtool source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install source tests (no Android SDK or Gradle)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check -e . pytest
      - name: Test R32 and existing source contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_android_r32_hosted_provider.py \
            tests/test_r32_python_go_contracts.py \
            tests/test_actions_a09_ci_host_contract.py \
            tests/test_rm01_output_scopes.py \
            tests/test_rm06_graph_export.py \
            --junitxml "$RUNNER_TEMP/devtool-r32-tests.xml"
      - name: Record non-release source identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r32-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/r32-evidence/source.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/r32-evidence/tree.txt"
          printf '%s\n' "${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" > "$RUNNER_TEMP/r32-evidence/run-attempt.txt"
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'r32-evidence'/'qualification.json'
          p.write_text(json.dumps({'schema':'devtool.android-r32.source-qualification.v1',
              'source_sha':os.environ['GITHUB_SHA'],
              'real_gradle_executed':False,'apk_signature_verified':False,
              'device_qualified':False,'release_qualified':False,
              'fc09_qualified':False},sort_keys=True,indent=2)+'\n')
          PY
          if test -f "$RUNNER_TEMP/devtool-r32-tests.xml"; then
            cp "$RUNNER_TEMP/devtool-r32-tests.xml" "$RUNNER_TEMP/r32-evidence/tests.xml"
          fi
          (cd "$RUNNER_TEMP/r32-evidence" && sha256sum ./* > SHA256SUMS)
      - name: Upload R32 source evidence (not a release artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-r32-source-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/r32-evidence/
          if-no-files-found: error
          retention-days: 7
