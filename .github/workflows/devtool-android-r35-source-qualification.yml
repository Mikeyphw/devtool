# R35 exact-run importer source contracts. No Gradle, secrets, import, or release.
name: Devtool R35 exact-run artifact import source qualification (non-release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact Devtool source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install source-only test dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check -e . pytest
      - name: Run overlay-targeted provenance and registry tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_r35_verified_import.py \
            tests/test_r35_termux_validation.py \
            tests/test_python_support.py \
            tests/test_project_runners.py \
            tests/test_actions_04_artifact_retrieval.py \
            tests/test_actions_g01_artifact_attempt_safety.py \
            tests/test_android_artifacts.py \
            tests/test_android_r31_consumer_handoff.py \
            tests/test_rem06_artifact_lifecycle_registry.py \
            tests/test_r34_generated_android_lab.py \
            tests/test_remed_r03b_destructive_fixed_point.py \
            --junitxml "$RUNNER_TEMP/r35-targeted.xml"
      - name: Record source-only evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r35-source"
          git rev-parse HEAD > "$RUNNER_TEMP/r35-source/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/r35-source/tree.txt"
          printf '%s\n' "${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" > "$RUNNER_TEMP/r35-source/run-attempt.txt"
          if test -f "$RUNNER_TEMP/r35-targeted.xml"; then
            cp "$RUNNER_TEMP/r35-targeted.xml" "$RUNNER_TEMP/r35-source/tests.xml"
          fi
          (cd "$RUNNER_TEMP/r35-source" && sha256sum ./* > SHA256SUMS)
      - name: Upload non-release source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: devtool-r35-source-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/r35-source/
          if-no-files-found: error
          retention-days: 7
