name: Devtool DN03-R3 generated native .NET node verification (source gate)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devtool-dn03r3-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  dn03-r3-source:
    name: DN03-R3 source and adversarial native receipt tests (non-release)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact reviewed Devtool source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Pinned Python interpreter
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          check-latest: false
      - name: Install reviewed source and deterministic test entrypoint
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e . pytest
      - name: Verify R3 exporter, node verifier and prior DN gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pytest -q \
            tests/test_dn03_r3_verified_export.py \
            tests/test_dn03_r2_runtime_native.py \
            tests/test_dn03_dotnet_export.py \
            tests/test_dn02_dotnet_hosts.py \
            tests/test_dn01_dotnet_compat.py \
            tests/test_rm09_dotnet.py \
            tests/test_next0203_r1_node_evidence.py \
            tests/test_rm06_rm09_consolidated_closure.py \
            tests/test_fc06_dotnet_shared_restore.py
          git diff --exit-code
      - name: Record source-only evidence and immutable run identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          mkdir -p "$RUNNER_TEMP/dn03r3-source"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/dn03r3-source/source-sha.txt"
          printf '%s/%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/dn03r3-source/run.txt"
          sha256sum devtool/actions_dn03_r3.py \
                    devtool/actions_dn03_r3_verify.py \
                    tests/test_dn03_r3_verified_export.py \
            > "$RUNNER_TEMP/dn03r3-source/source-sha256.txt"
      - name: Upload local test receipt (not hosted consumer acceptance)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dn03r3-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dn03r3-source/
          if-no-files-found: warn
          retention-days: 14
