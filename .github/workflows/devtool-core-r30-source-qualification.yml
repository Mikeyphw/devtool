name: Devtool CORE-R30 source and cleanup qualification (non-release)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: none

concurrency:
  group: core-r30-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-and-cleanup:
    name: CORE-R30 canonical OCI, guides and fresh-worker verification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install reviewed source and pytest
        run: python -m pip install -e . pytest
      - name: Independently refuse OCI or generated-guide drift
        run: |
          python tools/core_r30_contract_audit.py \
            --repo "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/core-r30-source.json"
      - name: Verify synthetic cleanup worker authority and refusals
        run: |
          python -m pytest -q \
            tests/test_core_r30_cleanup_replay.py \
            tests/test_rmp_c02_consumed_source_authority.py \
            tests/test_rmp_c02_worker_exit_recovery.py \
            tests/test_rmp_c02_cleanup_recovery.py \
            tests/test_apply_terminal_cleanup_hardening.py \
            tests/test_complete_feature_guides.py \
            tests/test_oci05_repository_execution_contract.py \
            --junitxml "$RUNNER_TEMP/core-r30-tests.xml"
      - name: Require source-bound unqualified receipt
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import subprocess
          root=Path(os.environ['GITHUB_WORKSPACE'])
          receipt=Path(os.environ['RUNNER_TEMP'])/'core-r30-source.json'
          doc=json.loads(receipt.read_text())
          assert doc['source']['sha']==os.environ['GITHUB_SHA']
          assert doc['source']['tree']==subprocess.check_output(
              ['git','rev-parse','HEAD^{tree}'],cwd=root,text=True).strip()
          assert doc['status']=='PASS'
          assert doc['release_qualified'] is False
          assert doc['fc08_overall_qualified'] is False
          print('PASS_CORE_R30_HOSTED_NON_RELEASE_EXACT_SOURCE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-r30-nonrelease-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/core-r30-source.json
            ${{ runner.temp }}/core-r30-tests.xml
          if-no-files-found: error
          retention-days: 14
