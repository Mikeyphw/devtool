# GENERATED by python -m devtool.actions_android_lab_export export
# Native source of truth: RM-06 compile_graph; no independent job DAG.
# Fixture: tests/fixtures/r33_hosted_android
name: Devtool R34 generated hosted native Android DAG (not release)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: devtool-r34-${{ github.ref }}
  cancel-in-progress: false
jobs:
  node-01:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact Devtool source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Initialize bounded source/run evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/r34-evidence"
          python3 - <<'PYR34BOOT'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'r34-evidence'/'bootstrap.json'
          p.write_text(json.dumps({'schema':'devtool.r34.bootstrap.v1','source_sha':os.environ['GITHUB_SHA'],
            'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'job':'lint','status':'NOT_QUALIFIED','release_qualified':False})+chr(10))
          PYR34BOOT
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install native Devtool runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -e .
      - name: Verify generated workflow equals reviewed native graph
        shell: bash
        run: |
          set -euo pipefail
          python3 -m devtool.actions_android_lab_export verify --repo "$GITHUB_WORKSPACE"
      - name: Reviewed Java SDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: Reviewed Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: 15859902
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"
      - name: Pinned Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Generate hash-checked Gradle wrapper on hosted runner
        shell: bash
        run: |
          set -euo pipefail
          GEN="$RUNNER_TEMP/r34-wrapper-generator"
          test ! -e "$GEN"
          mkdir -p "$GEN"
          printf '%s\n' 'rootProject.name = "r34-wrapper"' > "$GEN/settings.gradle"
          (cd "$GEN" && gradle --offline --no-daemon :wrapper --gradle-version 8.11.1 --distribution-type bin --gradle-distribution-sha256-sum f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6)
          printf "%s  %s\n" "2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046" "$GEN/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          grep -Fq "distributionSha256Sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6" "$GEN/gradle/wrapper/gradle-wrapper.properties"
          cp "$GEN/gradle/wrapper/gradle-wrapper.jar" "$RUNNER_TEMP/gradle-8.11.1-wrapper.jar"
      - name: Prepare deterministic Devtool fixture and compile native graph
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/r33_hosted_android_evidence.py prepare --repo "$GITHUB_WORKSPACE" --fixture "$RUNNER_TEMP/r34-fixture" --jar "$RUNNER_TEMP/gradle-8.11.1-wrapper.jar" --out "$RUNNER_TEMP/r34-evidence/source.json"
          python3 tools/r33_hosted_android_evidence.py plan --repo "$GITHUB_WORKSPACE" --fixture "$RUNNER_TEMP/r34-fixture" --out "$RUNNER_TEMP/r34-evidence/plan.json"
      - name: Execute actual reviewed node via Devtool RM-06
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/r33_hosted_android_evidence.py execute --repo "$GITHUB_WORKSPACE" --fixture "$RUNNER_TEMP/r34-fixture" --job lint --out "$RUNNER_TEMP/r34-evidence/result.json"
      - name: Record failed non-release stage
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r34-evidence"
          python3 -m devtool.actions_android_lab_export failure --job lint --out "$RUNNER_TEMP/r34-evidence/failure.json"
      - name: Upload source-bound node evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devtool-r34-node-01-evidence-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/r34-evidence/
          if-no-files-found: error
          retention-days: 7
