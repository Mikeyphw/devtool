name: Release qualification

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-qualification-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_DATE_EPOCH: '1784030400'
  PYTHONUNBUFFERED: '1'

jobs:
  core:
    name: Core / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/release-qualify.py --core-only --output dist/release-qualification.json
      - name: Upload failure snapshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-failure-${{ matrix.python }}
          path: |
            dist/qualification-logs
            tests/snapshots/ui
          if-no-files-found: ignore

  qt:
    name: Qt 6 native build and package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt build and runtime modules
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build qt6-base-dev qt6-declarative-dev libgl1-mesa-dev \
            qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-templates \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-dialogs
      - name: Configure and link
        run: cmake -S desktop/devtool-control-center -B build/qt -G Ninja -DCMAKE_BUILD_TYPE=Release -DDEVTOOL_ENABLE_TESTS=ON
      - run: cmake --build build/qt --parallel
      - name: Native offscreen smoke tests
        run: ctest --test-dir build/qt --output-on-failure
      - name: Build Debian package twice and compare
        env:
          BUILD_DIR: ${{ github.workspace }}/build/qt
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/dist/desktop-first" desktop/devtool-control-center/package-deb.sh --skip-build --verify
          OUT_DIR="$GITHUB_WORKSPACE/dist/desktop-second" desktop/devtool-control-center/package-deb.sh --skip-build --verify
          first=$(find dist/desktop-first -name '*.deb' -print -quit)
          second=$(find dist/desktop-second -name '*.deb' -print -quit)
          python tools/verify-identical.py "$first" "$second"
          mkdir -p dist/desktop
          cp dist/desktop-first/* dist/desktop/
      - uses: actions/upload-artifact@v4
        with:
          name: devtool-control-center-debian
          path: dist/desktop/*
      - name: Upload QML diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qt-failure
          path: |
            build/qt/Testing
            tests/snapshots/ui
          if-no-files-found: ignore

  android:
    name: Android lint, unit tests, and signed release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Create ephemeral CI signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/devtool-release.jks" \
            -storepass changeit -keypass changeit -alias devtool-ci \
            -keyalg RSA -keysize 3072 -validity 2 \
            -dname 'CN=Devtool CI,OU=Release Qualification,O=Devtool,C=US'
          echo "DEVTOOL_RELEASE_STORE_FILE=$RUNNER_TEMP/devtool-release.jks" >> "$GITHUB_ENV"
          echo 'DEVTOOL_RELEASE_STORE_PASSWORD=changeit' >> "$GITHUB_ENV"
          echo 'DEVTOOL_RELEASE_KEY_ALIAS=devtool-ci' >> "$GITHUB_ENV"
          echo 'DEVTOOL_RELEASE_KEY_PASSWORD=changeit' >> "$GITHUB_ENV"
      - name: Lint, local tests, signed release, and reproducibility
        working-directory: android/devtool-live-hud
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintRelease testReleaseUnitTest verifyReleaseApk
          mkdir -p "$GITHUB_WORKSPACE/dist/android-reports"
          cp -R app/build/reports/. "$GITHUB_WORKSPACE/dist/android-reports/"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app-release-first.apk"
          ./gradlew --no-daemon clean verifyReleaseApk
          python "$GITHUB_WORKSPACE/tools/verify-identical.py"             "$RUNNER_TEMP/app-release-first.apk" app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: devtool-live-hud-release
          path: |
            android/devtool-live-hud/app/build/outputs/apk/release/app-release.apk
            dist/android-reports
      - name: Upload Android diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-failure
          path: |
            android/devtool-live-hud/app/build/reports
            android/devtool-live-hud/app/build/outputs/logs
          if-no-files-found: ignore

  android-device:
    name: Android emulator instrumentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'system-images;android-35;google_apis;x86_64'
      - name: Run instrumentation smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android/devtool-live-hud && chmod +x gradlew && ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation
          path: android/devtool-live-hud/app/build/reports/androidTests
          if-no-files-found: ignore

  source-release:
    name: Deterministic release bundle
    runs-on: ubuntu-latest
    needs: [core, qt, android, android-device]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python tools/build-release.py --out-dir dist/release --verify-reproducible
      - uses: actions/upload-artifact@v4
        with:
          name: devtool-source-release
          path: dist/release/*
