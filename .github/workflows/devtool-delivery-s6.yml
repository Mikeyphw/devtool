name: Devtool S6 Unified Delivery Evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-evidence:
    name: Unified event stream and restart-safe receipt tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install project and pytest
        run: python -m pip install -e . pytest
      - name: Validate S1-S6 current behavior and negatives
        run: |
          python -m compileall -q devtool/delivery_receipt.py devtool/delivery_session.py devtool/delivery_cli.py
          python -m pytest -q \
            tests/test_delivery_receipt.py \
            tests/test_delivery_session.py \
            tests/test_delivery_cli_surface.py \
            tests/test_delivery_ci_diagnostics.py \
            tests/test_delivery_ci_evidence.py \
            tests/test_delivery_ci_policy.py \
            tests/test_delivery_ci_registrar.py
