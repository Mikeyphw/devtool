name: Devtool W02 portable .NET native graph source gate
on:
  pull_request:
    paths:
      - devtool/actions_graph_export.py
      - tests/test_w02_portable_dotnet.py
      - .github/workflows/devtool-w02-portable-dotnet-source.yml
  push:
    branches: [main]
    paths:
      - devtool/actions_graph_export.py
      - tests/test_w02_portable_dotnet.py
      - .github/workflows/devtool-w02-portable-dotnet-source.yml
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  native-graph-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact Devtool event commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          check-latest: false
      - name: Verify eligible merged-tree source evidence (read only)
        id: tree_reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B -m devtool.postmerge_ci decide --workflow devtool-w02-portable-dotnet-source.yml --scope ubuntu-24.04 --proof "${{ runner.temp }}/tree-proof.json"
      - name: Install tested Python dependencies (no .NET or Gradle)
        if: steps.tree_reuse.outputs.reuse != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check -e '.[textual]' 'pytest==8.4.2' pexpect
      - name: W02 .NET mixed-host source and compatibility regression
        if: steps.tree_reuse.outputs.reuse != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -B -m pytest -q \
            tests/test_w02_portable_dotnet.py \
            tests/test_rm09_dotnet.py \
            tests/test_rm07_toolchain_profiles.py
          echo W02_SOURCE_ONLY_PORTABLE_DOTNET_PASS
      - name: Record executed source tree proof
        if: success() && steps.tree_reuse.outputs.reuse != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: python -B -m devtool.postmerge_ci record --workflow devtool-w02-portable-dotnet-source.yml --scope ubuntu-24.04 --proof "${{ runner.temp }}/tree-proof.json"
      - name: Upload scoped source tree evidence (not release acceptance)
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: devtool-tree-proof-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-24.04
          path: ${{ runner.temp }}/tree-proof.json
          if-no-files-found: error
          retention-days: 14
