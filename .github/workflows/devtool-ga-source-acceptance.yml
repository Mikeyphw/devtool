name: Devtool GA Source Acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ga-source-contracts:
    name: ga-source-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact reviewed PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install exact checked-out candidate and source test dependencies
        run: python3 -B -m pip install --disable-pip-version-check . pytest pexpect cryptography
      - name: GA-00 source regression
        run: python3 -u -B tests/ga00_native_validate.py
      - name: GA-01 source regression
        if: ${{ hashFiles('tests/ga01_native_validate.py') != '' }}
        run: python3 -u -B tests/ga01_native_validate.py
      - name: GA-02 source regression
        if: ${{ hashFiles('tests/ga02_native_validate.py') != '' }}
        run: python3 -u -B tests/ga02_native_validate.py
      - name: GA-03 source regression
        run: python3 -B -m pytest -q tests/test_ga03_checks.py tests/test_dt25_absent_push_recovery.py tests/test_g0b_delivery_fork_and_provider.py tests/test_native_delivery_continuity_m3.py tests/test_native_delivery_contract_v3.py
      - name: W2 delivery recovery and signing profiles
        run: python3 -B -m pytest -q tests/test_w2_pr_recovery.py tests/test_w2_signing_profile.py tests/test_delivery_base_reconcile.py tests/test_core_x04_generated_surfaces.py tests/test_complete_feature_guides.py
