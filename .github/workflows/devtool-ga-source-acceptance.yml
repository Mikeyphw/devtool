name: Devtool GA Source Acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ga-source-contracts:
    name: ga-source-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact reviewed PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install exact checked-out candidate and source test dependencies
        run: python3 -B -m pip install --disable-pip-version-check . pytest pexpect cryptography
      - name: Verify real JDK signing fixture prerequisite
        run: keytool -help >/dev/null 2>&1
      # W3 is the audited superset of GA-00/01/02/03 and W2. Run once;
      # the independent CI24 workflow still enumerates all test modules.
      - name: Unified full W3 source acceptance
        run: python3 -u -B tests/w3_native_validate.py --profile full
