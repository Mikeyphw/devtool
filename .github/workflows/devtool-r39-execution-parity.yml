name: Devtool R39-R2 Serial Execution Parity (non-release)

# Manual, source-bound real-subprocess evidence; not an authorization to
# retire legacy behavior, nor parity for parallel, Android or remote workers.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devtool-r39-r2-parity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parity:
    name: Legacy/native bounded serial parity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Devtool
        run: python -m pip install -e .
      - name: Compare actual legacy/native subprocesses and event traces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/r39-r2
          python -m devtool.workflow_parity --json > out/r39-r2/serial-parity.json
      - name: Verify source identity, complete matrix and explicit non-qualification
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from devtool.workflow_parity import CASES, verify_matrix
          source = Path('out/r39-r2/serial-parity.json')
          report = json.loads(source.read_text(encoding='utf-8'))
          verify_matrix(report)
          assert report['source']['commit'] == os.environ['SOURCE_SHA']
          assert report['source']['tree']
          assert [item['name'] for item in report['cases']] == list(CASES)
          assert report['qualification']['legacy_retirement_authorized'] is False
          print('R39_R2_BOUNDED_SERIAL_PARITY_PASS; legacy retirement remains NOT QUALIFIED')
          PY
      - name: Upload paired subprocess, side-effect and terminal-event evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devtool-r39-r2-bounded-serial-parity
          path: out/r39-r2/
          if-no-files-found: error
          retention-days: 14
