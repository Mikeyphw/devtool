name: Devtool DN03-R4 native .NET cross-node receipt source qualification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devtool-dn03-r4-source-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  r4-source:
    name: DN03-R4 source, generated YAML and adversarial evidence (non-release)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout actual Devtool candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Pin Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          check-latest: false
      - name: Install checked-out source and pytest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check -e . pytest
      - name: Test DN03-R4 with earlier RM-09 source regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_dn03_r4_cross_node.py \
            tests/test_dn03_r3_verified_export.py \
            tests/test_dn03_r2_runtime_native.py \
            tests/test_dn03_dotnet_export.py \
            tests/test_rm09_dotnet.py \
            tests/test_next0203_r1_node_evidence.py
          git diff --exit-code
      - name: Save reviewed source-only receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dn03-r4-source"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/dn03-r4-source/source-sha.txt"
          printf '%s/%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/dn03-r4-source/run.txt"
          sha256sum devtool/actions_dn03_r4.py devtool/actions_dn03_r4_verify.py > "$RUNNER_TEMP/dn03-r4-source/modules.sha256"
          sha256sum tests/test_dn03_r4_cross_node.py > "$RUNNER_TEMP/dn03-r4-source/tests.sha256"
      - name: Upload non-release source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dn03-r4-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dn03-r4-source/
          if-no-files-found: warn
          retention-days: 14
