name: G3R current-source evidence consumer

on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: 'Prior run ID containing an uploaded native Termux evidence ZIP (leave empty for tests only)'
        required: false
        type: string
      evidence_artifact_name:
        description: 'Exact uploaded artifact name'
        required: false
        default: g3r-native-termux-evidence
        type: string
  push:
    paths:
      - 'devtool/g3r_*'
      - 'devtool/remed_r04b_fixed_point.py'
      - 'tests/test_g3r_*'
      - '.github/workflows/devtool-g3r-current-evidence.yml'

permissions:
  contents: read
  actions: read

jobs:
  candidate-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install regression test runner
        run: python -m pip install -e . pytest
      - name: G3R contract regressions (not device certification)
        run: python -m pytest -q tests/test_g3r_current_source_evidence.py tests/test_g3r_git_lookup_authority.py
      - name: Download previously uploaded Termux evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence_run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.evidence_artifact_name }}
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .g3r-incoming
      - name: Validate native Termux candidate against exact clean HEAD
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' candidates < <(find .g3r-incoming -type f -name '*.zip' -print0)
          if [[ ${#candidates[@]} != 1 ]]; then
            printf 'Expected exactly one candidate ZIP, found %s\n' "${#candidates[@]}" >&2
            exit 2
          fi
          python -m devtool.g3r_evidence_gate --repo "$PWD" --candidate "${candidates[0]}"

  android-g1-hosted:
    # Work is performed by GitHub's Linux runner; no Termux Gradle allowed.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK tools and adb
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Hosted Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Install source-bound Devtool
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run the real Android G1 gate and write source/attempt receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B -m devtool.g3r_hosted_android --output "$RUNNER_TEMP/g3r-android-g1"
      - name: Publish sanitized hosted G1 failure diagnosis
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: g3r-android-g1-failure
          path: ${{ runner.temp }}/g3r-android-g1/android_g1_failure.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish G3R hosted G1 evidence
        uses: actions/upload-artifact@v7
        with:
          name: g3r-android-g1-hosted
          path: ${{ runner.temp }}/g3r-android-g1/
          if-no-files-found: error
          retention-days: 14
