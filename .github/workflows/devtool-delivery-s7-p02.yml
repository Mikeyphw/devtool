name: Devtool S7 P02 Canonical Consumer CLI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install current Devtool and pytest
        run: python -m pip install -e . pytest
      - name: Canonical CLI, source binding and adoption regression
        run: python -m pytest -q tests/test_delivery_adoption.py tests/test_delivery_adoption_cli.py tests/test_delivery_cli_surface.py
      - name: Current source-bound launcher compatibility, immutable PYZ and security regression
        run: python -B -m pytest -q tests/test_launcher_contract_v3.py tests/test_launcher_runtime_compat.py tests/test_g0c3_launcher_compatibility.py
      - name: Generated parser and surfaces parity
        run: python -m devtool core surfaces --check share/core-generated
