name: Devtool FC-08 real-host observation (not qualification)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    name: ${{ matrix.lane }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, lane: github-actions-dag, host: Linux }
          - { os: ubuntu-24.04, lane: linux-polyglot, host: Linux }
          - { os: windows-2022, lane: windows-dotnet-msvc, host: Windows }
          - { os: macos-15, lane: macos-native, host: macOS }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Confirm checked-out source is the workflow source
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Observe actual host and installed tools
        shell: bash
        run: |
          python tools/fc08_evidence.py --output "fc08-${{ matrix.lane }}.json" \
            host-probe --root . --lane "${{ matrix.lane }}" --runner-os "${{ matrix.host }}"
      - name: Upload raw host observation, not a pass certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fc08-${{ matrix.lane }}-attempt${{ github.run_attempt }}
          path: fc08-${{ matrix.lane }}.json
          if-no-files-found: warn
          retention-days: 14
