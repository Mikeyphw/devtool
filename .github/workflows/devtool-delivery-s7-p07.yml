name: Devtool S7 P07 Final Integration Review

on:
  pull_request:
    paths:
      - devtool/delivery_integration_review.py
      - tests/test_delivery_integration_review.py
      - docs/DELIVERY_S7_P07_FINAL_INTEGRATION.md
      - .github/workflows/devtool-delivery-s7-p07.yml
      - devtool/delivery_cross_consumer.py
      - tests/test_delivery_cross_consumer.py
      - docs/DELIVERY_S7_P06_CROSS_CONSUMER.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-review:
    name: Source-bound integration and release-readiness review (non-release)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact Devtool PR source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure pinned Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: P07 current-source and historical consumer adversarial contracts
        run: python3 -B -m unittest discover -s tests -p 'test_delivery_integration_review.py' -v
      - name: Exact-head provider-backed integration review (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '0' }}
          HEAD_BRANCH: ${{ github.head_ref || '' }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/s7-p07-evidence"
          python3 -B -m devtool.delivery_integration_review \
            --repo "$GITHUB_WORKSPACE" --expected-head "$EXPECTED_HEAD" \
            --pr-number "$PR_NUMBER" --head-branch "$HEAD_BRANCH" \
            --output "$RUNNER_TEMP/s7-p07-evidence" --json > "$RUNNER_TEMP/s7-p07-stdout.json"
          test -s "$RUNNER_TEMP/s7-p07-evidence/s7-p07-evidence.json"
          test -s "$RUNNER_TEMP/s7-p07-evidence/s7-p07-readiness.md"
          python3 -B - <<'PY'
          import json, os, pathlib
          receipt = json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'s7-p07-evidence/s7-p07-evidence.json').read_text())
          assert receipt['schema'] == 'devtool.delivery-integration-review.v2'
          assert receipt['devtool_source_sha'] == os.environ['EXPECTED_HEAD']
          assert receipt['integration_source_consistency'] == 'passed'
          assert receipt['consumer_hosted_acceptance'] == 'passed'
          assert receipt['current_source_mode'] == ('current-pr' if int(os.environ['PR_NUMBER']) else 'main-manual')
          assert len(receipt['historical_consumers']) == 3
          assert all(c['state'] == 'merged' for c in receipt['historical_consumers'])
          assert receipt['release_readiness'] == 'blocked_pending_manual_gates'
          assert receipt['merge_permitted'] is False and receipt['release_qualified'] is False
          PY
      - name: Upload non-release final integration evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: devtool-s7-p07-integration-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/s7-p07-evidence/
          if-no-files-found: error
          retention-days: 14
