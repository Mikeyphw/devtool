name: Devtool FC-08 opt-in definitive API rejection and safe retry (non-release)

on:
  workflow_dispatch:
    inputs:
      authorize_real_dispatch:
        description: Explicitly authorize one rejected API POST and one successful no-op probe
        required: true
        type: boolean
        default: false

concurrency:
  group: fc08-r1r26-rejection-retry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  definitive-rejection-retry:
    name: Real HTTP 422 and journaled safe retry evidence
    if: inputs.authorize_real_dispatch == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install reviewed Devtool runtime
        run: python -m pip install -e . PyYAML
      - name: Real definitive HTTP 422, safe retry and journal reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FC08_DISPATCH_AUTHORIZED: ${{ inputs.authorize_real_dispatch }}
        run: python tools/fc08_dispatch_rejection_retry.py --out out/fc08/rejection-retry.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fc08-real-rejection-retry-attempt${{ github.run_attempt }}
          path: out/fc08/rejection-retry.json
          if-no-files-found: error
          retention-days: 14
