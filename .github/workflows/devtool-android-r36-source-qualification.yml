# R36 universal hosted Android source contracts. No Gradle, secrets, import or release.
name: Devtool R36 universal hosted Android source qualification (non-release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact Devtool source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install source-only test dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check -e . pytest
      - name: Run overlay-targeted Android provider and native DAG tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_r36_universal_hosted_android.py \
            tests/test_android_r32_hosted_provider.py \
            tests/test_r34_generated_android_lab.py \
            tests/test_next02_evidence_kernel.py \
            tests/test_next03_language_providers.py \
            tests/test_rm06_graph_export.py \
            tests/test_rm00_shared_contracts.py \
            tests/test_r35_termux_validation.py \
            tests/test_r35_verified_import.py \
            tests/test_remed_r03b_destructive_fixed_point.py \
            --junitxml "$RUNNER_TEMP/r36-targeted.xml"
      - name: Record source-only evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r36-source"
          git rev-parse HEAD > "$RUNNER_TEMP/r36-source/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/r36-source/tree.txt"
          printf '%s\n' "${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" > "$RUNNER_TEMP/r36-source/run-attempt.txt"
          if test -f "$RUNNER_TEMP/r36-targeted.xml"; then
            cp "$RUNNER_TEMP/r36-targeted.xml" "$RUNNER_TEMP/r36-source/tests.xml"
          fi
          (cd "$RUNNER_TEMP/r36-source" && sha256sum ./* > SHA256SUMS)
      - name: Upload non-release source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: devtool-r36-source-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/r36-source/
          if-no-files-found: error
          retention-days: 7
