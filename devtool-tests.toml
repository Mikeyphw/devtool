schema_version = 1

[environment]
manager = "uv"
requirements_lock = "devtool-test-requirements.lock"
python = ">=3.11"


# TEST-X02 stable roadmap/check identities. The durable id/alias is semantic;
# selectors may move as the suite is reorganized around behavior boundaries.

[[checks]]
id = "test.failure-trustworthiness"
name = "Failure trustworthiness and process-state isolation"
runner = "pytest"
selector = "tests/test_test_x01_failure_trustworthiness.py"
aliases = ["TEST-X01"]
behavior = "test-system.isolation"
lanes = ["integration"]
resources = ["serial-process-global", "requires-git"]
parallel_safety = "serial-process-global"
required_tools = ["git"]
budget_class = "integration"
contract_level = "public-contract"
groups = ["roadmap.test.g1", "roadmap.test.foundation"]

[checks.migration]
source_campaign = "TEST-X01"
historical_selector = "tests/test_test_x01_failure_trustworthiness.py"

[[checks]]
id = "test.g1.isolation-trust"
name = "TEST-G1 isolation/trust milestone"
runner = "pytest"
selector = "tests/test_test_g1_isolation_trust_gate.py"
aliases = ["TEST-G1"]
behavior = "test-system.isolation-gate"
lanes = ["system"]
resources = ["serial-process-global", "requires-git"]
parallel_safety = "serial-process-global"
required_tools = ["git"]
budget_class = "system"
contract_level = "public-contract"
groups = ["roadmap.test.g1", "roadmap.test.system"]

[[checks]]
id = "test.selection.framework"
name = "Language-neutral test selection contracts"
runner = "pytest"
selector = "tests/test_test_selection.py"
aliases = ["TS00-selection"]
behavior = "test-system.selection"
lanes = ["fast"]
parallel_safety = "parallel-safe"
budget_class = "fast"
contract_level = "public-contract"
groups = ["roadmap.test.g2", "roadmap.test.foundation"]

[[checks]]
id = "test.pytest.policy"
name = "Pytest strict policy and portable harness contracts"
runner = "pytest"
selector = "tests/test_pytest_revitalization.py"
behavior = "test-system.pytest-policy"
lanes = ["fast"]
parallel_safety = "parallel-safe"
budget_class = "fast"
contract_level = "public-contract"
groups = ["roadmap.test.g2", "roadmap.test.foundation"]

[[checks]]
id = "test.validation.truth"
name = "Validation session truth contracts"
runner = "pytest"
selector = "tests/test_rem07_validation_truth_sessions.py"
behavior = "validation.session-truth"
lanes = ["integration"]
resources = ["serial-repository"]
parallel_safety = "serial-repository"
budget_class = "integration"
contract_level = "public-contract"
groups = ["roadmap.test.g2"]

[[checks]]
id = "test.validation.reports"
name = "Validation report persistence contracts"
runner = "pytest"
selector = "tests/test_validation_reports_phase32.py"
behavior = "validation.reporting"
lanes = ["integration"]
resources = ["serial-repository"]
parallel_safety = "serial-repository"
budget_class = "integration"
contract_level = "public-contract"
groups = ["roadmap.test.g2"]

[[checks]]
id = "test.git.transaction-isolation"
name = "Isolated Git transaction worktree contracts"
runner = "pytest"
selector = "tests/test_git_frx03_isolated_worktree_transactions.py"
behavior = "git.transaction-isolation"
lanes = ["integration"]
resources = ["serial-repository", "requires-git"]
parallel_safety = "serial-repository"
required_tools = ["git"]
budget_class = "integration"
contract_level = "public-contract"
groups = ["roadmap.test.g2"]

[[checks]]
id = "test.x02.inventory-selection"
name = "TEST-X02 stable inventory and selection contracts"
runner = "pytest"
selector = "tests/test_test_x02_inventory_selection.py"
aliases = ["TEST-X02"]
behavior = "test-system.inventory-selection"
lanes = ["fast"]
parallel_safety = "parallel-safe"
budget_class = "fast"
contract_level = "public-contract"
groups = ["roadmap.test.g2", "roadmap.test.foundation"]

[[checks]]
id = "test.g2.lane-selection"
name = "TEST-G2 lane and selection milestone"
runner = "pytest"
selector = "tests/test_test_g2_lane_selection_gate.py"
aliases = ["TEST-G2"]
behavior = "test-system.lane-selection-gate"
lanes = ["system"]
resources = ["serial-process-global"]
parallel_safety = "serial-process-global"
budget_class = "system"
contract_level = "public-contract"
groups = ["roadmap.test.g2", "roadmap.test.system"]

[[checks]]
id = "test.external.gradle-smoke"
name = "Real Gradle executable qualification smoke"
runner = "pytest"
selector = "tests/test_test_g2_external_tools.py::test_real_gradle_tool_when_available"
behavior = "test-system.external.gradle"
lanes = ["external"]
resources = ["requires-tool:gradle"]
parallel_safety = "serial-process-global"
required_tools = ["gradle"]
budget_class = "external"
contract_level = "public-contract"
groups = ["roadmap.test.g2.external"]

[[checks]]
id = "test.external.go-smoke"
name = "Real Go executable qualification smoke"
runner = "pytest"
selector = "tests/test_test_g2_external_tools.py::test_real_go_tool_when_available"
behavior = "test-system.external.go"
lanes = ["external"]
resources = ["requires-tool:go"]
parallel_safety = "serial-process-global"
required_tools = ["go"]
budget_class = "external"
contract_level = "public-contract"
groups = ["roadmap.test.g2.external"]

[[checks]]
id = "test.external.javac-smoke"
name = "Real javac/java qualification smoke"
runner = "pytest"
selector = "tests/test_test_g2_external_tools.py::test_real_javac_and_java_tools_when_available"
behavior = "test-system.external.javac"
lanes = ["external"]
resources = ["requires-tool:javac", "requires-tool:java"]
parallel_safety = "serial-process-global"
required_tools = ["javac", "java"]
budget_class = "external"
contract_level = "public-contract"
groups = ["roadmap.test.g2.external"]

[[groups]]
id = "roadmap.test.foundation"
description = "Fast/foundation contracts used while implementing the TEST roadmap."
checks = ["test.failure-trustworthiness", "test.selection.framework", "test.pytest.policy", "test.x02.inventory-selection"]

[[groups]]
id = "roadmap.test.g1"
aliases = ["TEST-G1-group"]
description = "TEST-G1 implementation plus authoritative milestone proof."
checks = ["test.failure-trustworthiness", "test.g1.isolation-trust"]

[[groups]]
id = "roadmap.test.g2"
aliases = ["TEST-G2-group"]
description = "Selection/inventory contracts that TEST-G2 will qualify."
checks = ["test.selection.framework", "test.pytest.policy", "test.validation.truth", "test.validation.reports", "test.git.transaction-isolation", "test.x02.inventory-selection", "test.g2.lane-selection"]

[[groups]]
id = "roadmap.test.system"
description = "Broad roadmap/seal checks; intentionally excluded from fast feedback."
checks = ["test.g1.isolation-trust", "test.g2.lane-selection"]

[[groups]]
id = "roadmap.test.g2.external"
description = "Exact external-tool checks used by TEST-G2 qualification."
checks = ["test.external.gradle-smoke", "test.external.go-smoke", "test.external.javac-smoke"]

# TEST-G2 audit-loop remediation: central classification rules move known heavy
# historical campaigns out of ordinary edit feedback without relying on file
# names as roadmap identity.  Rules classify selector-derived tests only;
# explicit durable checks above remain authoritative.
[[classifications]]
id = "campaign.frx-system"
pattern = "tests/test_frx*.py*"
lanes = ["system"]
resources = ["historical-campaign"]
parallel_safety = "serial-process-global"
budget_class = "system"
contract_level = "public-contract"
behavior = "federation.campaign-qualification"

[[classifications]]
id = "campaign.git-frx-system"
pattern = "tests/test_git_frx*.py*"
lanes = ["system"]
resources = ["historical-campaign", "requires-git"]
parallel_safety = "serial-repository"
required_tools = ["git"]
budget_class = "system"
contract_level = "public-contract"
behavior = "git-federation.campaign-qualification"

[[classifications]]
id = "campaign.final-seal-system"
pattern = "tests/test_*final_seal*.py*"
lanes = ["system"]
resources = ["historical-seal"]
parallel_safety = "serial-process-global"
budget_class = "system"
contract_level = "public-contract"
behavior = "roadmap.final-seal"

[[classifications]]
id = "campaign.final-reseal-system"
pattern = "tests/test_*final_reseal*.py*"
lanes = ["system"]
resources = ["historical-seal"]
parallel_safety = "serial-process-global"
budget_class = "system"
contract_level = "public-contract"
behavior = "roadmap.final-reseal"

[[classifications]]
id = "campaign.final-qualification-system"
pattern = "tests/test_*final_qualification*.py*"
lanes = ["system"]
resources = ["historical-seal"]
parallel_safety = "serial-process-global"
budget_class = "system"
contract_level = "public-contract"
behavior = "roadmap.final-qualification"

[[classifications]]
id = "integration.pty"
pattern = "tests/test_validation_interactive_menu.py*"
lanes = ["integration"]
resources = ["requires-pty"]
parallel_safety = "serial-process-global"
required_capabilities = ["posix"]
budget_class = "integration"
contract_level = "public-contract"
behavior = "validation.interactive-pty"

[[classifications]]
id = "campaign.any-seal-system"
pattern = "tests/test_*seal*.py*"
lanes = ["system"]
resources = ["historical-seal"]
parallel_safety = "serial-process-global"
budget_class = "system"
contract_level = "public-contract"
behavior = "roadmap.seal-qualification"

[[checks]]
id = "core.x01.registry-trust"
name = "CORE-X01 canonical CLI/config registry and trust boundary"
runner = "pytest"
selector = "tests/test_core_x01_registry.py"
aliases = ["CORE-X01"]
behavior = "core.registry-trust"
lanes = ["fast"]
parallel_safety = "parallel-safe"
budget_class = "fast"
contract_level = "public-contract"
groups = ["roadmap.core.g1", "roadmap.core.foundation"]

[[groups]]
id = "roadmap.core.foundation"
description = "CORE registry, runtime envelope, and run-store foundation contracts."
checks = ["core.x01.registry-trust", "core.x02.runtime-envelope", "core.x03.run-store-wrapper"]

[[groups]]
id = "roadmap.core.g1"
aliases = ["CORE-G1-group"]
description = "CORE-X01/X02 command, config, wrapper, runtime-envelope, and trust contracts qualified by CORE-G1."
checks = ["core.x01.registry-trust", "core.x02.runtime-envelope", "core.g1.identity-authority"]

[[checks]]
id = "core.x02.runtime-envelope"
name = "CORE-X02 effective config, secret-safe runtime envelope, and CLI surface"
runner = "pytest"
selector = "tests/test_core_x02_runtime_envelope.py"
aliases = ["CORE-X02"]
behavior = "core.runtime-envelope"
lanes = ["fast"]
parallel_safety = "parallel-safe"
budget_class = "fast"
contract_level = "public-contract"
groups = ["roadmap.core.g1", "roadmap.core.foundation"]

[[checks]]
id = "core.g1.identity-authority"
name = "CORE-G1 command/config/runtime identity and trust gate"
runner = "pytest"
selector = "tests/test_core_g1_identity_authority_gate.py"
aliases = ["CORE-G1"]
behavior = "core.identity-authority-gate"
lanes = ["system"]
resources = ["serial-process-global"]
parallel_safety = "serial-process-global"
budget_class = "system"
contract_level = "public-contract"
groups = ["roadmap.core.g1"]

[[checks]]
id = "core.x03.run-store-wrapper"
name = "CORE-X03 RUN V3 catalog, stream/attachment storage, and wrapper runtime qualification"
runner = "pytest"
selector = "tests/test_core_x03_run_store.py"
aliases = ["CORE-X03"]
behavior = "core.run-store-wrapper-runtime"
lanes = ["fast"]
resources = ["filesystem-private-state"]
parallel_safety = "parallel-safe"
budget_class = "fast"
contract_level = "public-contract"
groups = ["roadmap.core.g2", "roadmap.core.foundation"]

[[groups]]
id = "roadmap.core.g2"
aliases = ["CORE-G2-group"]
description = "CORE-X03 durable run/catalog/wrapper-runtime contracts plus CORE-G2 qualification."
checks = ["core.x03.run-store-wrapper", "core.g2.run-store-authority"]

[[checks]]
id = "core.g2.run-store-authority"
name = "CORE-G2 RUN V3 private stream, attachment, GC, and wrapper authority gate"
runner = "pytest"
selector = "tests/test_core_g2_run_store_authority_gate.py"
aliases = ["CORE-G2"]
behavior = "core.run-store-authority-gate"
lanes = ["system"]
resources = ["filesystem-private-state", "serial-process-global"]
parallel_safety = "serial-process-global"
budget_class = "system"
contract_level = "public-contract"
groups = ["roadmap.core.g2"]

